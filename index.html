const { useState, useRef, useCallback } = React;

/* ───── DEMO DATA ───── */
const DEMO_BDD = `@eitc @tax-credits @turbotax
Feature: EITC Qualification Engine
  As a TurboTax user
  I want the system to determine if I qualify for the EITC
  So that I can maximize my tax refund

  Background:
    Given the tax year is 2024
    And the EITC income thresholds are loaded from IRS Publication 596
    And the investment income limit is $11,000

  # Acceptance Criteria: Basic EITC eligibility
  @happy-path @P0
  Scenario: Single filer with two qualifying children qualifies for EITC

  @happy-path @P1

    Given a taxpayer with filing status "Married Filing Jointly"
    And combined earned income of $22,000
    And 0 qualifying children
    And both taxpayers are between ages 25 and 65
    When the EITC eligibility check is performed
    Then the taxpayer should qualify for EITC
    And the estimated credit amount should be approximately $600

  @edge-case @boundary @P0
  Scenario: Income at exact EITC threshold boundary
    Given a taxpayer with filing status "Head of Household"
    And earned income of $55,768
    And 3 qualifying children under age 19
    When the EITC eligibility check is performed
    Then the taxpayer should be flagged for threshold review

  @error-handling @P0
  Scenario: Married Filing Separately is ineligible for EITC
    Given a taxpayer with filing status "Married Filing Separately"
    And earned income of $25,000
    And 1 qualifying child
    When the EITC eligibility check is performed
    Then the taxpayer should NOT qualify for EITC
    And the disqualification reason should be "MFS filing status is not eligible"`;

const DEMO_CODE = `/**
 * EITC Qualification Engine
 * Implements IRS Earned Income Tax Credit eligibility rules (2024)
 * @module EITCQualification
 */

// 2024 EITC Income Thresholds by filing status and number of children
const EITC_THRESHOLDS = {
  single: { 0: 18591, 1: 46560, 2: 52918, 3: 56838 },
  mfj:    { 0: 25511, 1: 53120, 2: 59478, 3: 63398 },
  hoh:    { 0: 18591, 1: 46560, 2: 52918, 3: 56838 },
};

const MAX_CREDIT = { 0: 632, 1: 3995, 2: 5980, 3: 6728 };
const MAX_INVESTMENT_INCOME = 11000;

// Step: Given a taxpayer with filing status {status}
export function createTaxpayer(filingStatus, earnedIncome, children, investmentIncome = 0) {
  return { filingStatus, earnedIncome, children: Math.min(children, 3), investmentIncome };
}

// Step: When the EITC eligibility check is performed
export function checkEITCEligibility(taxpayer) {
  const { filingStatus, earnedIncome, children, investmentIncome } = taxpayer;

  // MFS is always ineligible
  if (filingStatus === "Married Filing Separately") {
    return { eligible: false, reason: "MFS filing status is not eligible", credit: 0 };
  }

  // Investment income check
  if (investmentIncome > MAX_INVESTMENT_INCOME) {
    return { eligible: false, reason: \`Investment income \$\${investmentIncome} exceeds \$\${MAX_INVESTMENT_INCOME} limit\`, credit: 0 };
  }

  // Map filing status to threshold key
  const statusKey = filingStatus === "Married Filing Jointly" ? "mfj"
    : filingStatus === "Head of Household" ? "hoh" : "single";

  const threshold = EITC_THRESHOLDS[statusKey]?.[children];
  if (!threshold) return { eligible: false, reason: "Invalid filing configuration", credit: 0 };

  // Boundary check (within 1% of threshold)
  if (earnedIncome > threshold * 0.99 && earnedIncome <= threshold) {
    return { eligible: true, flagged: true, reason: "Income near threshold — manual review", credit: calculateCredit(earnedIncome, children, threshold) };
  }

  if (earnedIncome > threshold) {
    return { eligible: false, reason: \`Income \$\${earnedIncome} exceeds threshold \$\${threshold}\`, credit: 0 };
  }

  return { eligible: true, flagged: false, credit: calculateCredit(earnedIncome, children, threshold) };
}

function calculateCredit(income, children, threshold) {
  const maxCredit = MAX_CREDIT[children] || 0;
  const ratio = Math.max(0, 1 - (income / threshold));
  return Math.round(maxCredit * (0.5 + ratio * 0.5));
}`;

];

/* ───── CONFIG ───── */
const PERSONAS = {
  pm: { id:"pm", icon:"📋", title:"Product Manager", desc:"I have a raw spec or PRD and want executable BDD scenarios as a shared contract", color:"#F59E0B", gradient:"linear-gradient(135deg, #F59E0B, #D97706)", inputLabel:"📄 Paste Your Product Requirement / PRD", emphasis:"bdd", ctaText:"🚀 Generate BDD Specs from Requirement", focusBadges:["Requirement Traceability","Shared Contract","Acceptance Criteria"] },
  dev: { id:"dev", icon:"⚙️", title:"Developer", desc:"I have a requirement to build and want AI-generated code with BDD-backed tests", color:"#6366F1", gradient:"linear-gradient(135deg, #6366F1, #8B5CF6)", inputLabel:"🔧 Describe the Feature to Build", emphasis:"code", ctaText:"🚀 Generate Implementation from Spec", focusBadges:["Step Definitions","Code Architecture","Edge Case Coverage"] },

const SAMPLES = {
  pm: ["As a taxpayer filing with TurboTax, I want the system to determine if I qualify for the Earned Income Tax Credit (EITC) based on my filing status, income, and number of qualifying children, so that I can maximize my refund.", "As a first-time filer, I want TurboTax to provide a guided interview that asks me simple questions and translates my answers into the correct tax forms."],
  dev: ["Build a quarterly estimated tax payment calculator for self-employed taxpayers that factors in projected annual income, business deductions, self-employment tax, and prior year safe harbor rules.", "Implement the TurboTax W-2 import module that accepts a photographed W-2 image, extracts key fields via OCR, and validates against IRS format rules."],
  qa: ["Validate the W-2 import flow in TurboTax: a user photographs their W-2, the OCR extracts employer EIN, wages, and withholdings. Cover cases for blurry images, multiple W-2s, and amended forms.", "Test the EITC qualification engine for all filing statuses, income thresholds for 0-3 qualifying children, investment income limits, and age requirements."],

const SYSTEM_PROMPTS = {
  bdd: (p) => `You are a senior QA architect specializing in BDD for TurboTax at Intuit. Given a product ${p==="pm"?"requirement/PRD":p==="dev"?"feature spec":"test request"}, generate precise Gherkin BDD scenarios.\n\nRules:\n- Generate 3-4 scenarios covering happy path, edge cases, and error handling\n- Use realistic TurboTax domain data (2024 tax brackets, EITC thresholds, filing statuses)\n- Each scenario must have Feature, Scenario, Given, When, Then, And steps\n- Include @tags for categorization\n${p==="pm"?"- Add acceptance criteria notes as comments":""}${p==="qa"?"- Include boundary value scenarios and @priority tags (P0, P1, P2)":""}\n\nRespond ONLY with the Gherkin text. No markdown fences, no preamble.`,
  code: (p) => `You are a senior software engineer at Intuit working on TurboTax. Given BDD Gherkin scenarios, generate a clean JavaScript implementation.\n\nRules:\n- Implement the business logic described in the scenarios\n- Use clean, readable code with JSDoc comments\n${p==="dev"?"- Include detailed step definition mappings and error handling":"- Include step definitions as comments"}\n- Use realistic 2024 tax calculation logic\n- Keep under 90 lines\n\nRespond ONLY with the code. No markdown fences.`,
  tests: (p) => `You are a QA engineer at Intuit. Given BDD scenarios and implementation code, generate test execution results as a JSON array.\n\nEach test: { "scenario": name, "steps": [{ "text": step, "status": "passed"|"failed"|"skipped", "duration": ms }], "status": "passed"|"failed", "duration": ms${p==="qa"?', "coverage": "94%", "risk": "low"|"medium"|"high"':""}}\n\nMake 80-90% pass. Respond ONLY with valid JSON array.`,
};

async function callClaude(apiKey, systemPrompt, userMessage) {
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, system: systemPrompt, messages: [{ role: "user", content: userMessage }] }),
  });
  const data = await resp.json();
  if (data.error) throw new Error(data.error.message || "API error");
  return data.content.filter(b => b.type === "text").map(b => b.text).join("\n");
}

/* ───── COMPONENTS ───── */

function GherkinViewer({ text }) {
  if (!text) return null;
  return React.createElement("pre", { className: "gherkin-pre" },
    text.split("\n").map((line, i) => {
      const t = line.trim();
      let color = "#CBD5E1", weight = 400;
      if (t.startsWith("Feature:")) { color = "#F59E0B"; weight = 700; }
      else if (t.startsWith("Scenario")) { color = "#10B981"; weight = 600; }
      else if (t.startsWith("Background:")) { color = "#A78BFA"; weight = 600; }
      else if (/^(Given|When|Then|And|But)\b/.test(t)) color = "#38BDF8";
      else if (t.startsWith("#")) color = "#64748B";
      else if (t.startsWith("@")) color = "#F472B6";
      return React.createElement("div", { key: i, style: { color, fontWeight: weight, minHeight: 20 } }, line);
    })
  );
}

function CodeViewer({ text }) {
  if (!text) return null;
  return React.createElement("pre", { className: "code-pre" },
    text.split("\n").map((line, i) => {
      let color = "#E2E8F0";
      if (line.trim().startsWith("//") || line.trim().startsWith("*")) color = "#64748B";
      else if (/\b(function|const|let|var|return|if|else|export|import|class|switch|case|default|throw|new)\b/.test(line)) color = "#C084FC";
      else if (/\b(true|false|null|undefined)\b/.test(line)) color = "#F59E0B";
      return React.createElement("div", { key: i, style: { color, minHeight: 20 } },
        React.createElement("span", { style: { color: "#475569", marginRight: 16, userSelect: "none", display: "inline-block", width: 30, textAlign: "right" } }, i + 1),
        line
      );
    })
  );
}

function TestResults({ results, persona }) {
  if (!results?.length) return null;
  const total = results.length, passed = results.filter(r => r.status === "passed").length;
  const pct = Math.round((passed / total) * 100);
  const isQA = persona === "qa";

  return React.createElement("div", null,
    React.createElement("div", { className: "test-summary" },
      React.createElement("div", { className: "test-summary-row" },
        React.createElement("span", { className: "test-pct" }, pct + "%"),
        React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: 2 } },
          React.createElement("span", { style: { color: "#94A3B8" } }, passed + " passed · " + (total - passed) + " failed · " + total + " scenarios"),
          isQA && React.createElement("span", { style: { color: "#64748B", fontSize: 11 } }, "Coverage: " + (results[0]?.coverage || "N/A") + " · Risk: " + (results.some(r => r.risk === "high") ? "⚠️ High" : "✅ Low"))
        )
      ),

            i < arr.length - 1 && React.createElement("div", { className: "step-line", style: { background: done ? cfg.color : "#334155" } })

        React.createElement("div", { className: "sample-row" },

          SAMPLES[persona].map((s, i) => React.createElement("button", { key: i, className: "sample-btn", style: { color: personaCfg.color, borderColor: personaCfg.color + "44" }, onClick: () => setRequirement(s), disabled: loading }, "Sample " + (i + 1)))
        ),

          style: { background: loading || !requirement.trim() ? "#334155" : personaCfg.gradient },

      ),

        React.createElement("div", { className: "value-props" },
