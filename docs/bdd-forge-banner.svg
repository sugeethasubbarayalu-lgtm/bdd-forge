<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1120"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="720" height="200" rx="16" fill="url(#bg)"/>
  <rect x="0" y="194" width="720" height="6" rx="0" fill="url(#accent)"/>
  
  <!-- Pipeline arrows background -->
  <text x="360" y="160" text-anchor="middle" font-family="monospace" font-size="12" fill="#475569">
    Requirements → BDD Scenarios → Implementation → Test Results
  </text>
  
  <!-- Title -->
  <text x="360" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#F8FAFC">
    <tspan fill="#6366F1">BDD</tspan> Forge
  </text>
  
  <!-- Subtitle -->
  <text x="360" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94A3B8" font-weight="300">
    AI-Powered Behavioral Driven Development for TurboTax
  </text>
  
  <!-- Badge -->
  <rect x="280" y="18" width="160" height="24" rx="12" fill="url(#accent)"/>
  <text x="360" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" font-weight="700" letter-spacing="1">
    🏆 PM-XD HACKATHON 2026
  </text>
</svg>
